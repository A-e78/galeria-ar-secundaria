<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f4f9">
    <title>Galería AR Escolar</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f9;
            padding: 20px;
            margin: 0;
        }

        .contenedor {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }

        h1 {
            color: #333;
            font-size: 27px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        select {
            width: 100%;
            padding: 14px;
            margin: 12px 0 20px;
            border: 2px solid #ddd;
            border-radius: 9px;
            background: white;
            font-size: 16px;
        }

        model-viewer {
            width: 100%;
            height: 430px;
            display: none;
            background-color: #eef2f5;
            border-radius: 10px;

            /* Solo afecta al renderizado del visor web. */
            exposure: 1;
        }

        #mensaje-instruccion {
            padding: 40px 20px;
            color: #888;
            border: 2px dashed #ddd;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <h1>Exposición AR Escolar</h1>

        <p>
            Selecciona el diseño de un alumno y utiliza el botón
            de realidad aumentada del visor para colocarlo en tu entorno.
        </p>

        <select id="selector-modelo">
            <option value="">-- Selecciona un diseño --</option>
            <option value="modelos_ar/Australia.glb">Australia</option>
<option value="modelos_ar/Austria.glb">Austria</option>
<option value="modelos_ar/Canadá .glb">Canadá </option>
<option value="modelos_ar/China.glb">China</option>
<option value="modelos_ar/Corea.glb">Corea</option>
<option value="modelos_ar/Egipto.glb">Egipto</option>
<option value="modelos_ar/Escocia.glb">Escocia</option>
<option value="modelos_ar/Francia.glb">Francia</option>
<option value="modelos_ar/Grecia.glb">Grecia</option>
<option value="modelos_ar/Inglaterra .glb">Inglaterra </option>
<option value="modelos_ar/Italia.glb">Italia</option>
<option value="modelos_ar/Japón .glb">JapóN </option>
<option value="modelos_ar/Países Bajos.glb">PaíSes Bajos</option>
<option value="modelos_ar/Portugal.glb">Portugal</option>
<option value="modelos_ar/Rusia.glb">Rusia</option>
<option value="modelos_ar/Suecia.glb">Suecia</option>
<option value="modelos_ar/Suiza.glb">Suiza</option>
        </select>

        <div id="mensaje-instruccion">
            Selecciona un modelo para comenzar a visualizarlo.
        </div>

        <model-viewer
            id="visor-ar"
            ar
            ar-modes="webxr scene-viewer quick-look"
            ar-scale="auto"
            ar-placement="floor"
            camera-controls
            auto-rotate
            shadow-intensity="0.8"
            exposure="1">
        </model-viewer>
    </main>

    <script>
        const selector = document.getElementById("selector-modelo");
        const visor = document.getElementById("visor-ar");
        const instruccion = document.getElementById("mensaje-instruccion");

        /*
         * Registrar el evento antes de empezar a cargar los modelos.
         * Las correcciones se aplican al visor web y a WebXR.
         */
        visor.addEventListener("load", () => {
            if (!visor.model) return;

            for (const material of visor.model.materials) {
                const pbr = material.pbrMetallicRoughness;

                if (!pbr) continue;

                pbr.setMetallicFactor(0);
                pbr.setRoughnessFactor(0.85);
            }

            console.log("Modelo cargado y materiales ajustados.");
        });

        function cambiarModelo() {
            const ruta = selector.value;

            if (!ruta) {
                visor.removeAttribute("src");
                visor.removeAttribute("ios-src");
                visor.style.display = "none";
                instruccion.style.display = "block";
                return;
            }

            /*
             * Se utiliza el GLB corregido como fuente.
             * No asignar ios-src: model-viewer generará el USDZ
             * automáticamente cuando se active Quick Look.
             */
            visor.removeAttribute("ios-src");

            instruccion.style.display = "none";
            visor.style.display = "block";
            visor.src = ruta;
        }

        selector.addEventListener("change", cambiarModelo);
    </script>
</body>
</html>
